<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nebula" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 480) rotate(90) scale(520 760)">
      <stop stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#glow)"/>
  <ellipse cx="520" cy="230" rx="370" ry="160" fill="url(#nebula)"/>
  <ellipse cx="1140" cy="730" rx="400" ry="190" fill="url(#nebula)" opacity="0.55"/>

  <!-- Orion main stars -->
  <g stroke="#67e8f9" stroke-opacity="0.35" stroke-width="1.4" filter="url(#soft)">
    <line x1="470" y1="220" x2="585" y2="300"/>
    <line x1="585" y1="300" x2="695" y2="430"/>
    <line x1="695" y1="430" x2="760" y2="520"/>
    <line x1="760" y1="520" x2="915" y2="610"/>
    <line x1="695" y1="430" x2="780" y2="430"/>
    <line x1="780" y1="430" x2="855" y2="435"/>
    <line x1="585" y1="300" x2="760" y2="310"/>
  </g>

  <!-- Orion stars -->
  <g fill="#e2e8f0" fill-opacity="0.65">
    <circle cx="470" cy="220" r="4.2"/>
    <circle cx="585" cy="300" r="4.8"/>
    <circle cx="695" cy="430" r="5.2"/>
    <circle cx="760" cy="520" r="4.6"/>
    <circle cx="915" cy="610" r="6"/>
    <circle cx="760" cy="310" r="4"/>
    <circle cx="780" cy="430" r="4.5"/>
    <circle cx="855" cy="435" r="4.1"/>
  </g>

  <!-- belt emphasis -->
  <g fill="#93c5fd" fill-opacity="0.72">
    <circle cx="695" cy="430" r="2.5"/>
    <circle cx="780" cy="430" r="2.5"/>
    <circle cx="855" cy="435" r="2.5"/>
  </g>

  <!-- ambient stars -->
  <g fill="#cbd5e1" fill-opacity="0.38">
    <circle cx="145" cy="140" r="1.3"/>
    <circle cx="250" cy="90" r="1.1"/>
    <circle cx="340" cy="170" r="1.4"/>
    <circle cx="420" cy="120" r="0.9"/>
    <circle cx="1080" cy="120" r="1.1"/>
    <circle cx="1180" cy="170" r="1.2"/>
    <circle cx="1320" cy="120" r="1"/>
    <circle cx="1430" cy="180" r="1.5"/>
    <circle cx="210" cy="620" r="1.1"/>
    <circle cx="320" cy="700" r="1.6"/>
    <circle cx="460" cy="670" r="1.2"/>
    <circle cx="1210" cy="760" r="1.2"/>
    <circle cx="1360" cy="690" r="1.4"/>
    <circle cx="1480" cy="740" r="1.1"/>
    <circle cx="980" cy="860" r="1.3"/>
    <circle cx="860" cy="920" r="1.2"/>
  </g>
</svg>
